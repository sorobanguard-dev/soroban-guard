[package]
name = "vulnerable-token"
version = "0.1.0"
edition = "2021"
publish = false
description = "A deliberately non-conformant SEP-41 token, used to prove the guard's negative checks fire"

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = "28.0.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
