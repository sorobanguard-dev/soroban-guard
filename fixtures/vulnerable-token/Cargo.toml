[package]
name = "vulnerable-token"
version = "0.1.0"
edition = "2021"
publish = false
description = "A deliberately non-conformant SEP-41 token, used to prove the guard's negative checks fire"

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = "28.0.0"

[features]
# The public demo deployment: adds `faucet`, so anyone can take a few units
# and run the full suite against this token from the browser checker. Off by
# default — the recorded fixture keeps its admin-only mint.
demo-faucet = []

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
