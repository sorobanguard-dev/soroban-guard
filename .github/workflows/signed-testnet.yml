name: signed testnet

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install the packed CLI
        run: |
          mkdir "$RUNNER_TEMP/signed-testnet"
          pnpm --filter soroban-guard pack --pack-destination "$RUNNER_TEMP/signed-testnet"
          cd "$RUNNER_TEMP/signed-testnet"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund ./soroban-guard-*.tgz

      - name: Run the signed SEP-41 suite on Testnet
        run: |
          artifacts="$RUNNER_TEMP/signed-testnet-artifacts"
          mkdir "$artifacts"
          node packages/soroban-guard/scripts/signed-testnet.ts \
            "$RUNNER_TEMP/signed-testnet/node_modules/.bin/soroban-guard" \
            "$artifacts/report" 2>&1 | tee "$artifacts/run.log"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: signed-testnet-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/signed-testnet-artifacts/
          if-no-files-found: ignore
